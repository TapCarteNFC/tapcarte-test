<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap’Carte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3ef;
      color: #171717;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 34px 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 62px;
      height: 62px;
      border: 1.5px solid #171717;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -1px;
      font-weight: 700;
      text-align: center;
    }

    .tagline {
      margin: 8px 0 27px;
      text-align: center;
      color: #686868;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link {
      width: 100%;
      min-height: 57px;
      padding: 0 20px;
      border: 1px solid #dedbd5;
      border-radius: 18px;
      background: #fff;
      color: #171717;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
    }

    .featured {
      background: #171717;
      color: #fff;
      border-color: #171717;
    }

    .footer {
      margin-top: auto;
      padding-top: 35px;
      text-align: center;
      color: #8a8884;
      font-size: 11px;
      letter-spacing: .4px;
    }

    .footer strong {
      color: #171717;
    }

    .error {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<main class="page">

  <div class="logo" id="logo">TC</div>

  <h1 id="clientName">Tap’Carte</h1>

  <p class="tagline">
    Votre univers digital.<br>
    Accessible en un geste.
  </p>

  <div class="links">

    <a class="link featured" id="google" target="_blank">
      Laisser un avis Google
    </a>

    <a class="link" id="website" target="_blank">
      Visiter notre site web
    </a>

    <a class="link" id="instagram" target="_blank">
      Suivre sur Instagram
    </a>

    <a class="link" id="tiktok" target="_blank">
      Suivre sur TikTok
    </a>

    <a class="link" id="facebook" target="_blank">
      Suivre sur Facebook
    </a>

    <a class="link" id="services" target="_blank">
      Découvrir nos services
    </a>

    <a class="link" id="contact" target="_blank">
      Nous contacter
    </a>

    <a class="link" id="whatsapp" target="_blank">
      WhatsApp
    </a>

  </div>

  <div class="footer">
    Propulsé par <strong>Tap’Carte</strong>
  </div>

</main>

<script>

const API_URL =
  "https://x8ki-letl-twmt.n7.xano.io/api:card/get_card";

const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");

async function loadCard() {

  if (!slug) {
    return;
  }

  try {

    const response = await fetch(
      API_URL + "?slug=" + encodeURIComponent(slug)
    );

    const result = await response.json();

    if (!result || result.length === 0) {
      document.getElementById("clientName").textContent = "Carte introuvable";
      return;
    }

    const card = result[0];

    // Nom
    if (card.client_name) {
      document.getElementById("clientName").textContent =
        card.client_name;
    }

    // Logo
    if (card.logo_url) {
      document.getElementById("logo").innerHTML =
        '<img src="' + card.logo_url + '" alt="Logo">';
    }

    // Liens
    setLink("google", card.google_url);
    setLink("website", card.website_url);
    setLink("instagram", card.instagram_url);
    setLink("tiktok", card.tiktok_url);
    setLink("facebook", card.facebook_url);
    setLink("services", card.destination_url);
    setLink("contact", card.whatsapp_url);
    setLink("whatsapp", card.whatsapp_url);

  } catch (error) {

    console.error(error);

    document.getElementById("clientName").textContent =
      "Une erreur est survenue";
  }
}

function setLink(id, url) {

  const element = document.getElementById(id);

  if (!url) {
    element.style.display = "none";
    return;
  }

  element.href = url;
}

loadCard();

</script>

</body>
</html>
