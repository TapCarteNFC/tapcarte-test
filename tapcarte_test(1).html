<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap'Carte — Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #eee8df;
    color: #171513;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 26px 18px 22px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.25), transparent 30%),
      linear-gradient(145deg, #49372b 0%, #241914 48%, #5a4231 100%);
  }

  /* Faux photo de fond pour le test */
  .page::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 75% 18%, rgba(190,145,103,.34), transparent 28%),
      radial-gradient(ellipse at 25% 55%, rgba(150,108,75,.24), transparent 32%),
      repeating-linear-gradient(120deg, transparent 0 18px, rgba(255,255,255,.025) 19px 22px);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .logo {
    width: 78px;
    height: 78px;
    margin: 10px auto 18px;
    border-radius: 50%;
    background: #f4eee5;
    border: 1px solid rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 32px;
    letter-spacing: -4px;
    box-shadow: 0 8px 25px rgba(0,0,0,.18);
  }

  h1 {
    margin: 0;
    text-align: center;
    color: #fffaf3;
    font-family: Georgia, serif;
    font-size: 31px;
    font-weight: 400;
    letter-spacing: 5px;
  }

  .subtitle {
    text-align: center;
    color: #eee5da;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 8px;
  }

  .tagline {
    text-align: center;
    color: #f3e9dd;
    font-size: 12px;
    letter-spacing: 3px;
    line-height: 1.7;
    margin: 24px 20px 22px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .link {
    min-height: 58px;
    padding: 0 18px;
    border-radius: 32px;
    background: #f2ece4;
    color: #181513;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 5px 16px rgba(0,0,0,.15);
    transition: transform .15s ease, background .15s ease;
  }

  .link:active {
    transform: scale(.98);
  }

  .icon {
    width: 28px;
    text-align: center;
    font-size: 22px;
    flex: 0 0 28px;
  }

  .label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .arrow {
    font-size: 25px;
    line-height: 1;
    opacity: .75;
  }

  .address {
    color: #eee5da;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1.8px;
    margin-top: 26px;
    padding-bottom: 8px;
  }

  .pin { margin-right: 6px; }
</style>
</head>

<body>
  <main class="page">
    <div class="content">

      <div class="logo">ML</div>

      <h1>MAISON LÉA</h1>
      <div class="subtitle">COIFFURE &amp; BEAUTÉ</div>

      <div class="tagline">
        PRENEZ SOIN DE VOUS<br>
        À CHAQUE VISITE
      </div>

      <nav class="links">
        <a class="link" href="https://instagram.com/" target="_blank">
          <span class="icon">◎</span>
          <span class="label">Suivre sur Instagram</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="https://tiktok.com/" target="_blank">
          <span class="icon">♪</span>
          <span class="label">Suivre sur TikTok</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="https://facebook.com/" target="_blank">
          <span class="icon">●</span>
          <span class="label">Suivre sur Facebook</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="#">
          <span class="icon">▤</span>
          <span class="label">Nos services</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="#">
          <span class="icon">€</span>
          <span class="label">Nos tarifs</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="#">
          <span class="icon">□</span>
          <span class="label">Prendre rendez-vous</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="#">
          <span class="icon">⌁</span>
          <span class="label">Wi-Fi du salon</span>
          <span class="arrow">›</span>
        </a>

        <a class="link" href="https://wa.me/" target="_blank">
          <span class="icon">◔</span>
          <span class="label">Nous contacter</span>
          <span class="arrow">›</span>
        </a>
      </nav>

      <div class="address">
        <span class="pin">●</span> 12 RUE DES FLEURS, 75011 PARIS
      </div>

    </div>
  </main>
</body>
</html>
