<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap’Carte — Votre présence digitale, en un geste</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3ef;
      color: #171717;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 34px 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 62px;
      height: 62px;
      border: 1.5px solid #171717;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -1px;
      font-weight: 700;
    }

    .tagline {
      margin: 8px 0 27px;
      text-align: center;
      color: #686868;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link {
      width: 100%;
      min-height: 57px;
      padding: 0 20px;
      border: 1px solid #dedbd5;
      border-radius: 18px;
      background: #fff;
      color: #171717;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      transition: transform .15s ease, background .15s ease;
    }

    .link:hover {
      transform: translateY(-1px);
      background: #faf9f7;
    }

    .featured {
      background: #171717;
      color: #fff;
      border-color: #171717;
    }

    .featured:hover {
      background: #292929;
    }

    .footer {
      margin-top: auto;
      padding-top: 35px;
      text-align: center;
      color: #8a8884;
      font-size: 11px;
      letter-spacing: .4px;
    }

    .footer strong {
      color: #171717;
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="logo">TC</div>

    <h1>Tap’Carte</h1>

    <p class="tagline">
      Votre univers digital.<br>
      Accessible en un geste.
    </p>

    <div class="links">
      <a class="link featured" href="#">Laisser un avis Google</a>
      <a class="link" href="#">Visiter notre site web</a>
      <a class="link" href="#">Suivre sur Instagram</a>
      <a class="link" href="#">Suivre sur TikTok</a>
      <a class="link" href="#">Suivre sur Facebook</a>
      <a class="link" href="#">Découvrir nos services</a>
      <a class="link" href="#">Nous contacter</a>
      <a class="link" href="#">WhatsApp</a>
    </div>

    <div class="footer">
      Propulsé par <strong>Tap’Carte</strong>
    </div>

  </main>
</body>
</html>
